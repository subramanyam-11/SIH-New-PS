    <g transform="translate(20, 48)">
      <rect width="200" height="170" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="170" rx="2" fill="url(#accentGold)"/>
      <text x="14" y="24" fill="#f8fafc" font-size="12" font-weight="600">Statutory Workflow Engine</text>
      <text x="14" y="46" fill="#cbd5e1" font-size="10">• 7-Stage State Machine</text>
      <text x="14" y="64" fill="#cbd5e1" font-size="10">• Return / Resubmit Loops</text>
      <text x="14" y="82" fill="#cbd5e1" font-size="10">• Role Transition Validator</text>
      <text x="14" y="100" fill="#cbd5e1" font-size="10">• Strict Case Holder Locking</text>
      <text x="14" y="118" fill="#cbd5e1" font-size="10">• Re-entry Route Routing</text>
      <text x="14" y="138" fill="#fbbf24" font-size="9.5" font-weight="600">Section 15 Approved</text>
    </g>

    <!-- Service 2.2 -->
    <g transform="translate(240, 48)">
      <rect width="200" height="170" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="170" rx="2" fill="url(#accentGold)"/>
      <text x="14" y="24" fill="#f8fafc" font-size="12" font-weight="600">Fair Pendency Clock</text>
      <text x="14" y="46" fill="#cbd5e1" font-size="10">• Working-Days Calendar</text>
      <text x="14" y="64" fill="#cbd5e1" font-size="10">• Gazette Holidays &amp; Sun Excluded</text>
      <text x="14" y="82" fill="#cbd5e1" font-size="10">• Automatic Pause on Deficiencies</text>
      <text x="14" y="100" fill="#cbd5e1" font-size="10">• Institution SLA vs Dept SLA</text>
      <text x="14" y="118" fill="#cbd5e1" font-size="10">• Reversible Clock Simulator</text>
      <text x="14" y="138" fill="#fbbf24" font-size="9.5" font-weight="600">Statutory SLA Compliance</text>
    </g>

    <!-- Service 2.3 -->
    <g transform="translate(460, 48)">
      <rect width="200" height="170" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="170" rx="2" fill="url(#accentGold)"/>
      <text x="14" y="24" fill="#f8fafc" font-size="12" font-weight="600">Alert &amp; Escalation Engine</text>
      <text x="14" y="46" fill="#cbd5e1" font-size="10">• 7 Dynamic Statutory Rules</text>
      <text x="14" y="64" fill="#cbd5e1" font-size="10">• WARNING (48h) &amp; ESCALATED (24h)</text>
      <text x="14" y="82" fill="#cbd5e1" font-size="10">• Deduplicated Active Alerts</text>
      <text x="14" y="100" fill="#cbd5e1" font-size="10">• Explainable Breach Formulas</text>
      <text x="14" y="118" fill="#cbd5e1" font-size="10">• Outbox Delivery Queue</text>
      <text x="14" y="138" fill="#fbbf24" font-size="9.5" font-weight="600">Auto-Escalation to RO/HQ</text>
    </g>

    <!-- Service 2.4 -->
    <g transform="translate(680, 48)">
      <rect width="200" height="170" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="170" rx="2" fill="url(#accentGold)"/>
      <text x="14" y="24" fill="#f8fafc" font-size="12" font-weight="600">Risk &amp; EVC Engines</text>
      <text x="14" y="46" fill="#cbd5e1" font-size="10">• Multi-factor Delay Risk (0-100)</text>
      <text x="14" y="64" fill="#cbd5e1" font-size="10">• Low / Medium / High Bands</text>
      <text x="14" y="82" fill="#cbd5e1" font-size="10">• Conflict-Free Expert Selection</text>
      <text x="14" y="100" fill="#cbd5e1" font-size="10">• Geography &amp; Alumni Filters</text>
      <text x="14" y="118" fill="#cbd5e1" font-size="10">• Load Balancing Allocations</text>
      <text x="14" y="138" fill="#fbbf24" font-size="9.5" font-weight="600">Config: 39/69 Thresholds</text>
    </g>

    <!-- Service 2.5 -->
    <g transform="translate(900, 48)">
      <rect width="200" height="170" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="170" rx="2" fill="url(#accentPurple)"/>
      <text x="14" y="24" fill="#f8fafc" font-size="12" font-weight="600">National AICTE Adapter</text>
      <text x="14" y="46" fill="#cbd5e1" font-size="10">• Mock AICTE Central Bridge</text>
      <text x="14" y="64" fill="#cbd5e1" font-size="10">• HMAC-SHA256 Signatures</text>
      <text x="14" y="82" fill="#cbd5e1" font-size="10">• Replay Attack Timestamping</text>
      <text x="14" y="100" fill="#cbd5e1" font-size="10">• Exponential Backoff Sync</text>
      <text x="14" y="118" fill="#cbd5e1" font-size="10">• Idempotent Event Handlers</text>
      <text x="14" y="138" fill="#c084fc" font-size="9.5" font-weight="600">Production-Ready API Spec</text>
    </g>
  </g>

  <!-- CONNECTOR 2 -> 3 -->
  <g transform="translate(600, 575)">
    <line x1="0" y1="0" x2="0" y2="20" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="-5,18 0,26 5,18" fill="#fbbf24"/>
    <rect x="-140" y="4" width="280" height="18" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.75"/>
    <text x="0" y="16" fill="#94a3b8" font-size="9" text-anchor="middle" font-weight="600">SQLAlchemy 2.0 ORM / Connection Pool / Trigger Checks</text>
  </g>

  <!-- ================= TIER 3: DATA, AUDIT & SECURITY LAYER ================= -->
  <g transform="translate(40, 605)">
    <rect width="1120" height="165" rx="10" fill="url(#tierCardGrad)" stroke="#34d399" stroke-width="1.5" filter="url(#dropShadow)"/>
    <rect x="0" y="0" width="1120" height="32" rx="10" fill="#065f46" fill-opacity="0.3"/>
    <text x="20" y="22" fill="#34d399" font-size="13" font-weight="700" letter-spacing="1">TIER 3: DATA, CRYPTOGRAPHY &amp; COMPLIANCE PERSISTENCE (POSTGRESQL 16)</text>

    <!-- Storage 3.1 -->
    <g transform="translate(20, 48)">
      <rect width="250" height="100" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="100" rx="2" fill="url(#accentGreen)"/>
      <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="600">Relational Database Core</text>
      <text x="16" y="42" fill="#cbd5e1" font-size="10">• 17 Normalized Tables</text>
      <text x="16" y="58" fill="#cbd5e1" font-size="10">• Strict Foreign Keys &amp; Indexes</text>
      <text x="16" y="74" fill="#cbd5e1" font-size="10">• Alembic Revision 007 Migrations</text>
      <text x="16" y="90" fill="#34d399" font-size="9.5" font-weight="600">ACID Transaction Isolation</text>
    </g>

    <!-- Storage 3.2 -->
    <g transform="translate(295, 48)">
      <rect width="255" height="100" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="100" rx="2" fill="url(#accentGreen)"/>
      <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="600">Immutable Audit Ledger</text>
      <text x="16" y="42" fill="#cbd5e1" font-size="10">• SHA-256 Hash Chained Records</text>
      <text x="16" y="58" fill="#cbd5e1" font-size="10">• PostgreSQL Immutability Trigger</text>
      <text x="16" y="74" fill="#cbd5e1" font-size="10">• UPDATE / DELETE Strictly Blocked</text>
      <text x="16" y="90" fill="#34d399" font-size="9.5" font-weight="600">Tamper-Evident Verification</text>
    </g>

    <!-- Storage 3.3 -->
    <g transform="translate(575, 48)">
      <rect width="255" height="100" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="100" rx="2" fill="url(#accentGreen)"/>
      <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="600">AES-256-GCM Vault</text>
      <text x="16" y="42" fill="#cbd5e1" font-size="10">• Envelope Encrypted Files</text>
      <text x="16" y="58" fill="#cbd5e1" font-size="10">• Random 96-bit Nonce per File</text>
      <text x="16" y="74" fill="#cbd5e1" font-size="10">• 128-bit Authentication Tag</text>
      <text x="16" y="90" fill="#34d399" font-size="9.5" font-weight="600">Cross-Platform Python Inspector</text>
    </g>

    <!-- Storage 3.4 -->
    <g transform="translate(855, 48)">
      <rect width="245" height="100" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="100" rx="2" fill="url(#accentGreen)"/>
      <text x="16" y="22" fill="#f8fafc" font-size="12" font-weight="600">7-Year Retention &amp; Calendar</text>
      <text x="16" y="42" fill="#cbd5e1" font-size="10">• Statutory Archive Engine</text>
      <text x="16" y="58" fill="#cbd5e1" font-size="10">• Gazette Holiday Database</text>
      <text x="16" y="74" fill="#cbd5e1" font-size="10">• Cryptographic Chain Retention</text>
      <text x="16" y="90" fill="#34d399" font-size="9.5" font-weight="600">AICTE Regulatory Compliance</text>
    </g>
  </g>
</svg>
