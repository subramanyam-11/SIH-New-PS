<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="background:#0b132b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#0f2d59"/>
      <stop offset="100%" stop-color="#091e42"/>
    </linearGradient>
    
    <linearGradient id="tierCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background decorative grid lines -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
  </pattern>
  <rect width="1200" height="800" fill="url(#grid)" />

  <!-- HEADER BAR -->
  <rect x="40" y="25" width="1120" height="75" rx="8" fill="url(#headerGrad)" stroke="#334155" stroke-width="1.5" filter="url(#dropShadow)"/>
  <rect x="58" y="42" width="44" height="40" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <path d="M 68 62 L 80 52 L 92 62 L 80 72 Z" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="80" cy="52" r="2" fill="#f59e0b"/>
  <circle cx="92" cy="62" r="2" fill="#38bdf8"/>
  <circle cx="80" cy="72" r="2" fill="#10b981"/>
  <circle cx="68" cy="62" r="2" fill="#38bdf8"/>
  
  <text x="120" y="55" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="0.5">SIH26262: AICTE APPROVAL WORKFLOW &amp; COMPLIANCE AUTOMATION</text>
  <text x="120" y="78" fill="#94a3b8" font-size="12" font-weight="500">SYSTEM ARCHITECTURE (THREE-TIER REGULATORY GOVERNANCE PLATFORM)</text>
  <rect x="990" y="47" width="145" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="1005" y="67" fill="#38bdf8" font-size="11" font-weight="600">STRICT STATUTORY SLA</text>

  <!-- ================= TIER 1: PRESENTATION LAYER ================= -->
  <g transform="translate(40, 125)">
    <rect width="1120" height="175" rx="10" fill="url(#tierCardGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#dropShadow)"/>
    <rect x="0" y="0" width="1120" height="32" rx="10" fill="#0369a1" fill-opacity="0.3"/>
    <text x="20" y="22" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="1">TIER 1: PRESENTATION &amp; ROLE PORTALS (NEXT.JS 14 APP ROUTER + TAILWIND CSS)</text>
    
    <!-- Component 1.1 -->
    <g transform="translate(20, 48)">
      <rect width="250" height="110" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="110" rx="2" fill="url(#accentBlue)"/>
      <text x="16" y="24" fill="#f8fafc" font-size="13" font-weight="600">Role-Based Workspaces</text>
      <text x="16" y="46" fill="#94a3b8" font-size="10.5">6 Custom Dashboards:</text>
      <text x="16" y="64" fill="#cbd5e1" font-size="10.5">• Scrutiny, Regional Officer</text>
      <text x="16" y="80" fill="#cbd5e1" font-size="10.5">• EVC Coord, Committee, Head</text>
      <text x="16" y="96" fill="#cbd5e1" font-size="10.5">• Chairman &amp; Competent Authority</text>
    </g>

    <!-- Component 1.2 -->
    <g transform="translate(295, 48)">
      <rect width="255" height="110" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="110" rx="2" fill="url(#accentBlue)"/>
      <text x="16" y="24" fill="#f8fafc" font-size="13" font-weight="600">Workflow &amp; Clock UI</text>
      <text x="16" y="46" fill="#94a3b8" font-size="10.5">Statutory Case Views:</text>
      <text x="16" y="64" fill="#cbd5e1" font-size="10.5">• Interactive Stage Progression Tracker</text>
      <text x="16" y="80" fill="#cbd5e1" font-size="10.5">• Fair Pendency Clock Visualizer</text>
      <text x="16" y="96" fill="#cbd5e1" font-size="10.5">• Paused Clock &amp; Return Drawers</text>
    </g>

    <!-- Component 1.3 -->
    <g transform="translate(575, 48)">
      <rect width="255" height="110" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="110" rx="2" fill="url(#accentBlue)"/>
      <text x="16" y="24" fill="#f8fafc" font-size="13" font-weight="600">Alerts &amp; Intelligence</text>
      <text x="16" y="46" fill="#94a3b8" font-size="10.5">Explainable Analytics:</text>
      <text x="16" y="64" fill="#cbd5e1" font-size="10.5">• Explainable Alert Drawer &amp; Hierarchy</text>
      <text x="16" y="80" fill="#cbd5e1" font-size="10.5">• Bottleneck Regional Heat Grid</text>
      <text x="16" y="96" fill="#cbd5e1" font-size="10.5">• What-If Capacity Planner (Officers/EVC)</text>
    </g>

    <!-- Component 1.4 -->
    <g transform="translate(855, 48)">
      <rect width="245" height="110" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="110" rx="2" fill="url(#accentBlue)"/>
      <text x="16" y="24" fill="#f8fafc" font-size="13" font-weight="600">Compliance &amp; Institution</text>
      <text x="16" y="46" fill="#94a3b8" font-size="10.5">Self-Service Portals:</text>
      <text x="16" y="64" fill="#cbd5e1" font-size="10.5">• Institution Transparent Tracker</text>
      <text x="16" y="80" fill="#cbd5e1" font-size="10.5">• Deficiency Cure &amp; Re-submission</text>
      <text x="16" y="96" fill="#cbd5e1" font-size="10.5">• Undertakings &amp; Document Validity</text>
    </g>
  </g>

  <!-- CONNECTOR 1 -> 2 -->
  <g transform="translate(600, 305)">
    <line x1="0" y1="0" x2="0" y2="20" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="-5,18 0,26 5,18" fill="#38bdf8"/>
    <rect x="-135" y="4" width="270" height="18" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.75"/>
    <text x="0" y="16" fill="#94a3b8" font-size="9" text-anchor="middle" font-weight="600">RESTful JSON / JWT (Bearer) / Rate-Limited RBAC</text>
  </g>

  <!-- ================= TIER 2: ENGINE & APPLICATION SERVICES ================= -->
  <g transform="translate(40, 335)">
    <rect width="1120" height="235" rx="10" fill="url(#tierCardGrad)" stroke="#fbbf24" stroke-width="1.5" filter="url(#dropShadow)"/>
    <rect x="0" y="0" width="1120" height="32" rx="10" fill="#b45309" fill-opacity="0.3"/>
    <text x="20" y="22" fill="#fbbf24" font-size="13" font-weight="700" letter-spacing="1">TIER 2: ENGINE &amp; CORE STATUTORY SERVICES (FASTAPI + PYTHON 3.9)</text>

